spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:cancelacion_certificados}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  backend-base-url: ${APP_BACKEND_BASE_URL:http://localhost:${SERVER_PORT:8080}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  availability:
    stale-attempt-threshold: ${AVAILABILITY_STALE_ATTEMPT_THRESHOLD:30s}
    timeout: ${AVAILABILITY_TIMEOUT:1s}
    mock:
      simulated-timeout: ${AVAILABILITY_MOCK_SIMULATED_TIMEOUT:2s}
  recaptcha:
    mode: ${RECAPTCHA_MODE:google}
    google:
      secret-key: ${RECAPTCHA_SECRET_KEY}
      verify-uri: ${RECAPTCHA_VERIFY_URI:https://www.google.com/recaptcha/api/siteverify}
      timeout: ${RECAPTCHA_TIMEOUT:3s}
      allowed-hostnames: ${RECAPTCHA_ALLOWED_HOSTNAMES:localhost}
  id-peru:
    mode: ${ID_PERU_MODE:mock}
    version: v1
    frontend-return-path: /autorizacion
    client-id: ${ID_PERU_CLIENT_ID:}
    client-secret: ${ID_PERU_CLIENT_SECRET:}
    referer: ${ID_PERU_REFERER:http://localhost:3000/autorizacion}
    flow-secret: ${ID_PERU_FLOW_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    mock-scenario: ${ID_PERU_MOCK_SCENARIO:MATCH}
  certificate-listing:
    mode: ${CERTIFICATE_LISTING_MODE:mock}
  session:
    signing-secret: ${SESSION_SIGNING_SECRET:Y2FuY2VsYWNpb24tbG9jYWwtc2Vzc2lvbi1rZXktMzJiIQ==}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    pe.gob.reniec.certificados.cancelacion: ${LOG_LEVEL_APP:DEBUG}
