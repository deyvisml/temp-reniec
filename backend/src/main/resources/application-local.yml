spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:cancelacion_certificados}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  eligibility:
    stale-attempt-threshold: ${ELIGIBILITY_STALE_ATTEMPT_THRESHOLD:30s}
    timeout: ${ELIGIBILITY_TIMEOUT:1s}
    mock:
      simulated-timeout: ${ELIGIBILITY_MOCK_SIMULATED_TIMEOUT:2s}

logging:
  level:
    pe.gob.reniec.certificados.cancelacion: ${LOG_LEVEL_APP:DEBUG}
