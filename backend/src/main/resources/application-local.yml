spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:revocacion_credenciales_digitales}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  backend-base-url: ${APP_BACKEND_BASE_URL:http://localhost:${SERVER_PORT:8080}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  availability:
    stale-attempt-threshold: ${AVAILABILITY_STALE_ATTEMPT_THRESHOLD:30s}
    mock:
      simulated-timeout: ${AVAILABILITY_MOCK_SIMULATED_TIMEOUT:2s}
  recaptcha:
    mode: disabled
    google:
      secret-key: ${RECAPTCHA_SECRET_KEY}
      verify-uri: ${RECAPTCHA_VERIFY_URI:https://www.google.com/recaptcha/api/siteverify}
      timeout: ${RECAPTCHA_TIMEOUT:3s}
      allowed-hostnames: ${RECAPTCHA_ALLOWED_HOSTNAMES:localhost}
  id-peru:
    mode: real
    version: v1
    frontend-return-path: /autorizacion
    client-id: ${ID_PERU_CLIENT_ID:}
    client-secret: ${ID_PERU_CLIENT_SECRET:}
    referer: ${ID_PERU_REFERER:http://localhost:3000/autorizacion}
    flow-secret: ${ID_PERU_FLOW_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  credential-provider:
    mode: ${CREDENTIAL_PROVIDER_MODE:real}
    base-url: ${CREDENTIAL_PROVIDER_BASE_URL:http://localhost:8081}
    api-key: ${CREDENTIAL_PROVIDER_API_KEY:app_revocaciones_reniec.RENIEC2026}
  revocation:
    mock-outcome: ${REVOCATION_MOCK_OUTCOME:SUCCEEDED}
    propagation-delay: ${REVOCATION_PROPAGATION_DELAY:60s}
  receipt:
    mode: ${RECEIPT_MODE:filesystem}
    storage-root: ${RECEIPT_STORAGE_ROOT:storage/receipts}
    processing-enabled: ${RECEIPT_PROCESSING_ENABLED:true}
    processing-interval: ${RECEIPT_PROCESSING_INTERVAL:5s}
    require-absolute-storage-root: false
  session:
    signing-secret: ${SESSION_SIGNING_SECRET:cmV2b2NhY2lvbi1sb2NhbC1zZXNzaW9uLWtleS0zMmJ5dGVzIQ==}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    pe.gob.reniec.credenciales.revocacion: ${LOG_LEVEL_APP:DEBUG}
