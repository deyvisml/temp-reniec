spring:
  application:
    name: ${APP_NAME:revocacion-credenciales-digitales-backend}
  flyway:
    clean-disabled: true
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: true
  paths-to-match:
    - /api/v1/**
    - /actuator/health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  recaptcha:
    mode: ${RECAPTCHA_MODE:disabled}
  id-peru:
    mode: disabled
    version: v1
  credential-provider:
    mode: ${CREDENTIAL_PROVIDER_MODE:disabled}
    base-url: ${CREDENTIAL_PROVIDER_BASE_URL:}
    api-key: ${CREDENTIAL_PROVIDER_API_KEY:}
    connect-timeout: ${CREDENTIAL_PROVIDER_CONNECT_TIMEOUT:3s}
    read-timeout: ${CREDENTIAL_PROVIDER_READ_TIMEOUT:5s}
  digital-credential-listing:
    stale-reservation-threshold: ${DIGITAL_CREDENTIAL_LISTING_STALE_THRESHOLD:30s}
  revocation:
    mock-outcome: ${REVOCATION_MOCK_OUTCOME:SUCCEEDED}
    stale-submission-threshold: ${REVOCATION_STALE_SUBMISSION_THRESHOLD:30s}
    propagation-delay: ${REVOCATION_PROPAGATION_DELAY:60s}
  receipt:
    mode: ${RECEIPT_MODE:disabled}
    storage-root: ${RECEIPT_STORAGE_ROOT:storage/receipts}
    stale-generation-threshold: ${RECEIPT_STALE_GENERATION_THRESHOLD:1m}
    processing-interval: ${RECEIPT_PROCESSING_INTERVAL:5s}
    processing-enabled: ${RECEIPT_PROCESSING_ENABLED:false}
    require-absolute-storage-root: ${RECEIPT_REQUIRE_ABSOLUTE_STORAGE_ROOT:true}
  session:
    issuer: revocacion-credenciales-digitales-backend
    audience: revocacion-credenciales-digitales-flow
    signing-secret: ${SESSION_SIGNING_SECRET:}
    access-ttl: ${SESSION_ACCESS_TTL:15m}
    refresh-ttl: ${SESSION_REFRESH_TTL:3d}
    concurrent-refresh-window: ${SESSION_CONCURRENT_REFRESH_WINDOW:5s}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  health:
    db:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    pe.gob.reniec.credenciales.revocacion: ${LOG_LEVEL_APP:INFO}
