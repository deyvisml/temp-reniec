name: revocacion-credenciales-digitales-stack

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: revocacion_credenciales_digitales
      MYSQL_USER: revocacion_app
      MYSQL_PASSWORD: revocacion_local_dev
      MYSQL_ROOT_PASSWORD: revocacion_root_local_dev
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - application

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: revocacion_credenciales_digitales
      DB_USERNAME: revocacion_app
      DB_PASSWORD: revocacion_local_dev
      APP_FRONTEND_BASE_URL: http://localhost:3000
      APP_BACKEND_BASE_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_SIGNING_SECRET: cmV2b2NhY2lvbi1sb2NhbC1zZXNzaW9uLWtleS0zMmJ5dGVzIQ==
      SESSION_COOKIE_SECURE: "false"
      CREDENTIAL_PROVIDER_MODE: real
      CREDENTIAL_PROVIDER_BASE_URL: http://host.docker.internal:8081
      CREDENTIAL_PROVIDER_API_KEY: app_revocaciones_reniec.RENIEC2026
      LOGGING_LEVEL_PE_GOB_RENIEC_CREDENCIALES_REVOCACION_REVOCATION_PROVIDER: DEBUG
      RECEIPT_MODE: filesystem
      RECEIPT_STORAGE_ROOT: /app/storage/receipts
      RECEIPT_PROCESSING_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./backend/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - receipt-data:/app/storage/receipts
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        NEXT_PUBLIC_APP_ENV: local
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_APP_ENV: local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application

networks:
  application:
    driver: bridge

volumes:
  mysql-data:
  receipt-data:
