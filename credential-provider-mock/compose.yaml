name: credential-provider-mock-local

services:
  credential-provider:
    build:
      context: .
    environment:
      API_KEY: ${API_KEY:-local-credential-provider-key}
      PERSONAL_TEST_DNI: ${PERSONAL_TEST_DNI:-}
      PORT: 8081
      SEED_FILE: /app/fixtures/credentials.seed.json
      DATA_FILE: /app/data/credentials.json
    ports:
      - "8081:8081"
    volumes:
      - credential-provider-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  credential-provider-data:
